spring.application.name=auth-service
server.port=${PORT:8081}

# Banco: DB_URL aponta para o MySQL online (veja o .env da raiz).
# Sem DB_URL, usa H2 em memória (só para desenvolvimento/testes).
spring.datasource.url=${DB_URL:jdbc:h2:mem:auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Segredo compartilhado do JWT (o mesmo em todos os serviços). Mínimo 32 caracteres.
nexum.jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-32+}
nexum.jwt.ttl-hours=${JWT_TTL_HOURS:10}

# Primeiro administrador (criado só se não houver nenhum funcionário)
nexum.admin.email=${ADMIN_EMAIL:admin@acasadotenis.com.br}
nexum.admin.password=${ADMIN_PASSWORD:nexum-admin}

management.endpoints.web.exposure.include=health
