spring.application.name=pedidos-service
server.port=${PORT:8080}

# ── Banco ──────────────────────────────────────────────────────────────────
# Padrão: H2 em memória, para rodar sem instalar nada (dados somem ao parar).
# Para o MySQL (Aiven), rode com o perfil "mysql" (veja application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:pedidos;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── Equipe (login HTTP Basic até o auth-service existir) ────────────────────
# Em produção defina NEXUM_STAFF_USER e NEXUM_STAFF_PASSWORD. Os valores padrão
# abaixo servem só para desenvolvimento local.
nexum.staff.username=${NEXUM_STAFF_USER:equipe}
nexum.staff.password=${NEXUM_STAFF_PASSWORD:nexum-dev}

# ── Front-end que pode chamar a API (CORS) ─────────────────────────────────
nexum.cors.allowed-origins=${NEXUM_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Pedidos de exemplo ao subir com o banco vazio
nexum.sample-data=${NEXUM_SAMPLE_DATA:true}

# Kafka ainda não é usado; evita tentar conectar em um broker
spring.kafka.listener.auto-startup=false
