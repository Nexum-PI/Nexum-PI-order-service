# Perfil "mysql": banco MySQL (ex.: Aiven). Ative com SPRING_PROFILES_ACTIVE=mysql.
# As credenciais vêm de variáveis de ambiente (NUNCA commite senhas):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
nexum.sample-data=${NEXUM_SAMPLE_DATA:false}
