spring.application.name=pedidos-service
server.port=${PORT:8082}

# Banco: DB_URL aponta para o MySQL online (veja o .env da raiz).
# Sem DB_URL, usa H2 em memória (só para desenvolvimento/testes).
spring.datasource.url=${DB_URL:jdbc:h2:mem:pedidos;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Segredo compartilhado do JWT (o mesmo do auth-service)
nexum.jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-32+}

# Kafka: eventos de pedido (pedidos.eventos)
nexum.kafka.enabled=${KAFKA_ENABLED:false}
nexum.kafka.topic=pedidos.eventos
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.auto-startup=false

# Pedidos de exemplo ao subir com o banco vazio
nexum.sample-data=${SAMPLE_DATA:true}

management.endpoints.web.exposure.include=health
