# NEXUM · back-end em microsserviços
# Subir tudo:   docker compose up -d --build
# A API fica em http://localhost:8080 (gateway). Configure o banco no arquivo .env.

x-db: &db
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  PORT: 8080

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    environment:
      <<: *db
      DB_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_PREFIX:-nexum}_auth?sslMode=${DB_SSL_MODE:-REQUIRED}&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    restart: on-failure

  pedidos-service:
    build: ./pedidos-service
    environment:
      <<: *db
      DB_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_PREFIX:-nexum}_pedidos?sslMode=${DB_SSL_MODE:-REQUIRED}&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SAMPLE_DATA: ${SAMPLE_DATA:-true}
    depends_on:
      kafka: { condition: service_healthy }
    restart: on-failure

  notificacao-service:
    build: ./notificacao-service
    environment:
      <<: *db
      DB_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_PREFIX:-nexum}_notificacoes?sslMode=${DB_SSL_MODE:-REQUIRED}&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
    restart: on-failure

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    environment:
      FRONT_ORIGIN: ${FRONT_ORIGIN:-http://localhost:5173}
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - auth-service
      - pedidos-service
      - notificacao-service
    restart: unless-stopped

  # Banco MySQL local (opcional), para quem estiver sem internet ou sem o banco online:
  #   docker compose --profile local-db up -d --build   (e no .env: DB_HOST=mysql, DB_SSL_MODE=DISABLED)
  mysql:
    image: mysql:8.4
    profiles: ["local-db"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
